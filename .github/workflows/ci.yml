name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: do not run `prepare` (husky) in CI.
      - run: npm ci --ignore-scripts

      - name: Type-check, ESLint, Stylelint, Prettier
        run: npm run lint:ci

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build-only

      - name: Dependency audit
        run: npm audit --audit-level=high
